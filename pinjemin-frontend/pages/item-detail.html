<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Detail Barang — Pinjemin</title>
  <link rel="stylesheet" href="../css/reset.css"/>
  <link rel="stylesheet" href="../css/tokens.css"/>
  <link rel="stylesheet" href="../css/base.css"/>
  <link rel="stylesheet" href="../css/layout.css"/>
  <link rel="stylesheet" href="../css/components/buttons.css"/>
  <link rel="stylesheet" href="../css/components/badges.css"/>
  <link rel="stylesheet" href="../css/components/cards.css"/>
  <link rel="stylesheet" href="../css/components/forms.css"/>
  <link rel="stylesheet" href="../css/components/modals.css"/>
  <link rel="stylesheet" href="../css/components/toasts.css"/>
  <link rel="stylesheet" href="../css/components/sidebar.css"/>
  <link rel="stylesheet" href="../css/components/bottomnav.css"/>
  <link rel="stylesheet" href="../css/components/avatars.css"/>
  <link rel="stylesheet" href="../css/components/rating-stars.css"/>
  <link rel="stylesheet" href="../css/pages/item-detail.css"/>
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="app-sidebar"></div>
  <div class="main-content">
    <header class="top-bar">
      <nav class="page-header__breadcrumb" id="breadcrumb"></nav>
    </header>
    <div class="page-content" id="page-body">
      <div class="empty-state"><div class="empty-state__icon">⏳</div><div class="empty-state__title">Memuat...</div></div>
    </div>
  </div>
</div>
<div id="app-bottom-nav"></div>

<!-- Borrow Modal -->
<div class="modal-backdrop" id="borrow-modal" role="dialog" aria-modal="true">
  <div class="modal modal--lg">
    <div class="modal__header">
      <div>
        <div class="modal__title">Ajukan Peminjaman</div>
        <div class="modal__subtitle" id="modal-item-name"></div>
      </div>
      <button class="modal__close" id="modal-close"><i data-lucide="x" style="width:18px;height:18px"></i></button>
    </div>
    <div class="modal__body">
      <div class="date-range" style="margin-bottom:var(--space-5)">
        <div class="form-group">
          <label class="form-label" for="start-date">Tanggal Mulai <span class="required">*</span></label>
          <input type="date" class="form-input" id="start-date"/>
        </div>
        <div class="form-group">
          <label class="form-label" for="end-date">Tanggal Selesai <span class="required">*</span></label>
          <input type="date" class="form-input" id="end-date"/>
        </div>
      </div>
      <div id="duration-info" style="margin-bottom:var(--space-5);font-size:var(--text-body-sm-size);color:var(--color-primary-600);font-weight:600"></div>
      <div class="form-group" style="margin-bottom:var(--space-5)">
        <label class="form-label" for="purpose">Tujuan Peminjaman <span class="required">*</span></label>
        <textarea class="form-textarea" id="purpose" rows="3" placeholder="Jelaskan mengapa kamu membutuhkan barang ini..." maxlength="200"></textarea>
        <div class="form-hint">Min. 10 karakter</div>
      </div>
      <div class="form-group" style="margin-bottom:var(--space-5)">
        <label class="form-label" for="msg">Pesan ke Pemilik (opsional)</label>
        <textarea class="form-textarea" id="msg" rows="2" placeholder="Tambahkan pesan..."></textarea>
      </div>
      <div class="info-card" id="deposit-info" style="display:none">
        <div class="info-card__icon">💰</div>
        <div class="info-card__content">
          <div class="info-card__title">Deposit Diperlukan</div>
          <div class="info-card__text" id="deposit-text"></div>
        </div>
      </div>
    </div>
    <div class="modal__footer">
      <button class="btn btn-outline-neutral btn-md" id="modal-cancel">Batal</button>
      <button class="btn btn-accent btn-md btn-pill" id="modal-submit">
        <i data-lucide="send" style="width:16px;height:16px"></i>
        Kirim Permintaan
      </button>
    </div>
  </div>
</div>

<script type="module" src="../js/pages/item-detail.js"></script>
</body>
</html>
