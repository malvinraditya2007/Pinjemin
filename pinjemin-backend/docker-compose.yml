version: '3.8'

# Database is now hosted on Neon.tech cloud — no local postgres container needed.
# Only Redis runs locally for caching / rate-limiting.

services:
  redis:
    image: redis:7-alpine
    container_name: pinjemin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
